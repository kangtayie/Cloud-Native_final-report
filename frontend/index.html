<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OverSpeak · 해외에서 직접 말하기</title>
<style>
  /* 디자인 토큰: 연한 하늘색 그라데이션 배경 + 흰 카드, 녹음은 코랄 */
  :root {
    --sky: #0284c7; --sky-soft: #e0f2fe; --coral: #f97316; --coral-dark: #ea580c;
    --ink: #0f172a; --muted: #64748b; --line: #e5e7eb; --card: #ffffff;
    --ok-bg: #dcfce7; --ok: #166534; --ng-bg: #fee2e2; --ng: #991b1b;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }  /* display:grid 등이 hidden 속성을 덮어쓰지 않게 */
  body {
    margin: 0; color: var(--ink); min-height: 100vh;
    font-family: "Pretendard", system-ui, -apple-system, "Malgun Gothic", sans-serif;
    background: linear-gradient(180deg, #dbeefe 0%, #f0f8ff 45%, #ffffff 100%);
  }
  button { font: inherit; border: 0; cursor: pointer; border-radius: 999px; padding: 10px 20px; font-weight: 600; color: #fff; background: var(--sky); }
  button:disabled { background: #cbd5e1; cursor: not-allowed; }

  /* 상단 바: 왼쪽 로고, 오른쪽 한 줄 소개 */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; max-width: 1200px; margin: 0 auto; padding: 18px 24px; }
  .topbar img { height: 34px; display: block; }
  .topbar .tagline { color: var(--muted); font-size: 0.95rem; }

  .wrap { max-width: 1200px; margin: 0 auto; padding: 8px 24px 40px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 6px 24px rgba(2, 132, 199, 0.08); }

  /* 번역기: 위쪽 언어 바 + 아래 좌우 두 칸 */
  .langbar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; border-bottom: 1px solid var(--line); padding: 10px 24px; }
  .langbar select { border: 0; background: transparent; font: inherit; font-size: 1.05rem; font-weight: 600; color: var(--ink); padding: 8px 4px; cursor: pointer; }
  .langbar select:focus { outline: 2px solid var(--sky-soft); border-radius: 8px; }
  .langbar .right { padding-left: 32px; }
  .swap { background: transparent; color: var(--muted); font-size: 1.3rem; padding: 6px 14px; }
  .swap:hover { background: var(--sky-soft); color: var(--sky); }
  .panes { display: grid; grid-template-columns: 1fr 1fr; min-height: 360px; }
  .pane { display: flex; flex-direction: column; padding: 22px 24px 16px; }
  .pane + .pane { border-left: 1px solid var(--line); background: #fbfdff; border-radius: 0 0 20px 0; }
  textarea { flex: 1; width: 100%; min-height: 220px; border: 0; resize: none; font: inherit; font-size: 1.6rem; line-height: 1.4; color: var(--ink); background: transparent; }
  textarea:focus { outline: none; }
  textarea::placeholder { color: #94a3b8; }
  .toolbar { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .toolbar .spacer { flex: 1; }
  .count { color: #94a3b8; font-size: 0.85rem; }
  .mic { background: var(--coral); }
  .mic:hover:not(:disabled) { background: var(--coral-dark); }
  .mic.recording { background: #dc2626; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(220, 38, 38, 0.15); } }
  .ghost { background: var(--sky-soft); color: var(--sky); }
  /* 아이콘 버튼: 배경 없이 검정 선 아이콘, 마우스를 올리면 연한 원 */
  .icon { background: transparent; color: #111827; padding: 8px; border-radius: 50%; line-height: 0; }
  .icon svg { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .icon:hover:not(:disabled) { background: #f1f5f9; }
  .icon:disabled { background: transparent; color: #cbd5e1; }
  .icon.recording { color: #dc2626; background: #fee2e2; animation: pulse 1.2s infinite; }

  /* 결과 칸: 번역문 크게, 그 아래 발음을 연한 글씨로 */
  .translated { flex: none; font-size: 1.6rem; line-height: 1.4; font-weight: 500; word-break: break-word; min-height: 2.2em; }
  .translated:empty::before { content: "번역 결과가 여기에 나와요"; color: #94a3b8; }
  .pron { margin-top: 10px; display: grid; gap: 4px; }
  .pron .hangul { font-size: 1.15rem; color: #475569; }
  .pron .roman { font-size: 1rem; color: #94a3b8; }
  .pron .tag { font-size: 0.72rem; color: var(--sky); background: var(--sky-soft); padding: 1px 7px; border-radius: 999px; margin-right: 6px; vertical-align: 2px; }
  .result-body { flex: 1; }
  .note { font-size: 0.85rem; color: var(--muted); margin-top: 8px; }

  /* 따라 말하기 카드 */
  .practice { margin-top: 20px; padding: 22px 24px; display: grid; grid-template-columns: 280px 1fr; gap: 28px; align-items: start; }
  .practice h2 { margin: 0 0 6px; font-size: 1.15rem; }
  .practice .mic { width: 100%; padding: 14px; font-size: 1.05rem; margin-top: 12px; }
  .score { font-size: 2.6rem; font-weight: 800; color: var(--sky); line-height: 1.1; }
  .words { margin-top: 10px; font-size: 1.15rem; }
  .words span { display: inline-block; margin: 3px 4px 3px 0; padding: 3px 10px; border-radius: 8px; }
  .words .ok { background: var(--ok-bg); color: var(--ok); }
  .words .ng { background: var(--ng-bg); color: var(--ng); text-decoration: underline wavy; }
  .placeholder { color: #94a3b8; padding-top: 8px; }
  footer { margin-top: 28px; text-align: center; font-size: 0.8rem; color: var(--muted); }

  /* 좁은 화면 임시 대응 (모바일 전용 디자인은 다음 단계) */
  @media (max-width: 860px) {
    .topbar .tagline { display: none; }
    .panes, .practice { grid-template-columns: 1fr; }
    .pane + .pane { border-left: 0; border-top: 1px solid var(--line); border-radius: 0 0 20px 20px; }
    textarea, .translated { font-size: 1.3rem; }
  }
</style>
</head>
<body>
  <header class="topbar">
    <img src="logo.png" alt="OverSpeak">
    <span class="tagline">해외에서, 번역기 대신 내 입으로 직접 말하기</span>
  </header>

  <main class="wrap">
    <!-- 번역기: 왼쪽 내 문장(타이핑·음성 입력), 오른쪽 현지어(번역·발음 표기·원어민 듣기) -->
    <section class="card">
      <div class="langbar">
        <div><select id="source" aria-label="내 언어"></select></div>
        <button id="swapBtn" class="swap" title="언어 바꾸기" aria-label="언어 바꾸기">⇄</button>
        <div class="right"><select id="target" aria-label="현지 언어"></select></div>
      </div>
      <div class="panes">
        <div class="pane">
          <textarea id="textInput" maxlength="1000" placeholder="번역할 내용을 입력하세요"></textarea>
          <div class="note" id="sttNote"></div>
          <div class="toolbar">
            <!-- 아이콘 버튼: 글자 대신 검정 선 아이콘, 의미는 title·aria-label로 전달 -->
            <button id="sttBtn" class="icon" title="말로 입력" aria-label="말로 입력">
              <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/><path d="M8 21h8"/></svg>
            </button>
            <span class="spacer"></span>
            <span class="count" id="charCount">0 / 1000</span>
            <button id="translateBtn" class="icon" title="번역하기 (Ctrl+Enter)" aria-label="번역하기">
              <svg viewBox="0 0 24 24"><path d="M4 12h15"/><path d="M13 6l6 6-6 6"/></svg>
            </button>
          </div>
        </div>
        <div class="pane" id="step2">
          <div class="result-body">
            <div id="resultText" class="translated"></div>
            <div id="pron" class="pron" hidden>
              <div class="hangul"><span class="tag">한글 발음</span><span id="hangul"></span></div>
              <div class="roman"><span class="tag">영어식 발음</span><span id="romanization"></span></div>
            </div>
            <div id="pronNote" class="note"></div>
          </div>
          <div class="toolbar">
            <button id="listenBtn" class="icon" title="원어민 발음 듣기" aria-label="원어민 발음 듣기" disabled>
              <svg viewBox="0 0 24 24"><path d="M3 9h4l6-5v16l-6-5H3z"/><path d="M17 9v6"/><path d="M21 6v12"/></svg>
            </button>
            <span id="listenNote" class="note" style="margin-top:0"></span>
          </div>
        </div>
      </div>
    </section>

    <!-- 따라 말하기: 녹음 → 현지어 인식 → 일치율 -->
    <section class="card practice" id="practice" hidden>
      <div>
        <h2>🎯 따라 말해 보기</h2>
        <div class="note" style="margin-top:0">원어민 발음을 듣고 똑같이 말해 보세요. 최대 15초, 다시 누르면 녹음이 끝나요.</div>
        <button id="recBtn" class="mic">🎤 녹음 시작</button>
        <div id="practiceNote" class="note"></div>
      </div>
      <div>
        <div class="placeholder" id="practiceEmpty">녹음하면 원어민 기준으로 얼마나 알아들을 수 있는지 보여드려요.</div>
        <div id="practiceResult" hidden>
          <div class="score" id="scoreText"></div>
          <div class="words" id="wordsBox"></div>
          <div class="note" id="heardText"></div>
        </div>
      </div>
    </section>

    <footer>OverSpeak · Amazon Transcribe · Translate · Bedrock · Polly 로 만든 서버리스 서비스</footer>
  </main>

<script>
  // API Gateway(HTTP API) $default 스테이지 호출 URL (끝에 / 없이)
  const API_BASE = "https://okkwmmuwl5.execute-api.ap-northeast-2.amazonaws.com";

  // 지원 언어: 파파고 지원 14개 + 동유럽(폴란드어·체코어·루마니아어 완전 지원, 헝가리어 부분 지원)
  // tts: Amazon Polly 원어민 음성 지원 여부
  const LANGS = [
    { code: "ko", name: "한국어", tts: true },
    { code: "en", name: "영어", tts: true },
    { code: "ja", name: "일본어", tts: true },
    { code: "zh", name: "중국어(간체)", tts: true },
    { code: "zh-TW", name: "중국어(번체)", tts: true },
    { code: "es", name: "스페인어", tts: true },
    { code: "fr", name: "프랑스어", tts: true },
    { code: "de", name: "독일어", tts: true },
    { code: "ru", name: "러시아어", tts: true },
    { code: "it", name: "이탈리아어", tts: true },
    { code: "ar", name: "아랍어", tts: true },
    { code: "vi", name: "베트남어", tts: false },
    { code: "th", name: "태국어", tts: false },
    { code: "id", name: "인도네시아어", tts: false },
    { code: "pl", name: "폴란드어", tts: true },
    { code: "cs", name: "체코어", tts: true },
    { code: "ro", name: "루마니아어", tts: true },
    { code: "hu", name: "헝가리어", tts: false },
  ];

  const $ = (id) => document.getElementById(id);
  const sourceSel = $("source"), targetSel = $("target");
  LANGS.forEach(l => {
    sourceSel.add(new Option(l.name, l.code));
    targetSel.add(new Option(l.name, l.code));
  });
  sourceSel.value = "ko";
  targetSel.value = "pl";

  let lastTranslation = null;

  // 글자 수 표시 (번역 람다 입력 제한 1000자와 맞춤)
  const updateCount = () => { $("charCount").textContent = `${$("textInput").value.length} / 1000`; };
  $("textInput").addEventListener("input", updateCount);
  // Ctrl+Enter로 번역 (자동 번역은 입력할 때마다 API를 불러 비용이 늘어서 쓰지 않음)
  $("textInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) $("translateBtn").click();
  });

  // 언어 바꾸기 (현지인에게 들은 말을 거꾸로 번역해 볼 때)
  $("swapBtn").onclick = () => {
    [sourceSel.value, targetSel.value] = [targetSel.value, sourceSel.value];
  };

  async function post(path, payload) { return request("POST", path, payload); }

  async function request(method, path, payload) {
    let res;
    // 429(스로틀링)는 잠깐 기다렸다가 최대 2번 다시 시도. 스로틀링에 걸린 요청은 람다까지 가지 않아 비용이 없음
    for (let attempt = 0; attempt < 3; attempt++) {
      if (attempt) await new Promise(r => setTimeout(r, 1500 * attempt));
      res = await fetch(API_BASE + path, method === "GET" ? {} : {
        method,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      if (res.status !== 429) break;
    }
    // API Gateway 자체 오류(503 등)는 JSON이 아닐 수 있어서 파싱 실패도 처리
    const data = await res.json().catch(() => ({}));
    // 429 = API Gateway 스로틀링(초당 2건, 버스트 5)에 걸린 경우. 남용 시 비용 상한을 위해 낮게 잡음
    if (res.status === 429) throw new Error("요청이 많아요. 잠시 후 다시 시도해 주세요.");
    if (!res.ok) throw new Error(data.error || `요청 실패 (HTTP ${res.status})`);
    return data;
  }

  $("translateBtn").onclick = async () => {
    const text = $("textInput").value.trim();
    if (!text) return;
    const target = targetSel.value;
    // 같은 언어끼리는 번역 API를 부르지 않음 (불필요한 호출 = 불필요한 비용)
    if (sourceSel.value === target) {
      $("sttNote").textContent = "내 언어와 현지 언어를 다르게 골라주세요.";
      return;
    }
    $("step2").hidden = false;
    $("resultText").textContent = "번역 중...";
    $("sttNote").textContent = "";
    $("listenBtn").disabled = true;
    $("listenNote").textContent = "";
    $("pron").hidden = true;
    $("pronNote").textContent = "";
    resetPractice(false);
    try {
      const data = await post("/translate", { text, source: sourceSel.value, target });
      lastTranslation = { text: data.translatedText, lang: target };
      $("resultText").textContent = data.translatedText;
      const ttsOk = LANGS.find(l => l.code === target)?.tts;
      $("listenBtn").disabled = !ttsOk;
      if (!ttsOk) $("listenNote").textContent = "이 언어는 아직 원어민 음성을 지원하지 않아요 (Amazon Polly 미지원).";
      // 따라 말하기는 들을 원어민 음성이 있어야 의미가 있어서 TTS 지원 언어만 보여줌 (PRD 4장)
      resetPractice(ttsOk);
      loadPronunciation(data.translatedText, target);  // 기다리지 않음: 번역 결과는 바로 보여줌
    } catch (e) {
      $("resultText").textContent = "오류: " + e.message;
    }
  };

  // 발음 표기 (Bedrock). 별도 람다라서 실패해도 번역·듣기는 그대로 동작 (장애 격리)
  const pronCache = new Map();  // 같은 문장은 Bedrock을 다시 부르지 않음 (토큰당 과금)
  async function loadPronunciation(text, lang) {
    $("pron").hidden = true;
    $("pronNote").textContent = "";
    if (lang === "ko") return;  // 한국어는 발음 표기가 필요 없음
    if (text.length > 300) {
      $("pronNote").textContent = "발음 표기는 300자 이하 문장만 지원해요.";
      return;
    }
    const key = lang + "|" + text;
    $("pronNote").textContent = "발음 표기 만드는 중...";
    try {
      if (!pronCache.has(key)) pronCache.set(key, await post("/pronounce", { text, lang }));
      if (lastTranslation?.text !== text) return;  // 그사이 다른 문장을 번역했으면 무시
      const p = pronCache.get(key);
      $("romanization").textContent = p.romanization;
      $("hangul").textContent = p.hangul;
      $("pron").hidden = false;
      $("pronNote").textContent = "발음 표기는 AI(Amazon Bedrock)가 만든 참고용이에요.";
    } catch (e) {
      if (lastTranslation?.text === text) $("pronNote").textContent = "발음 표기를 불러오지 못했어요: " + e.message;
    }
  }

  $("listenBtn").onclick = async () => {
    if (!lastTranslation) return;
    $("listenBtn").disabled = true;
    $("listenNote").textContent = "음성 생성 중...";
    try {
      // 같은 문장은 다시 Polly를 부르지 않고 저장해 둔 음성을 재생 (Polly는 글자 수로 과금)
      if (!lastTranslation.audio) {
        const data = await post("/speak", { text: lastTranslation.text, lang: lastTranslation.lang });
        lastTranslation.audio = data.audio;
        lastTranslation.voiceInfo = `목소리: ${data.voice} (${data.engine})`;
      }
      await new Audio("data:audio/mpeg;base64," + lastTranslation.audio).play();
      $("listenNote").textContent = lastTranslation.voiceInfo;
    } catch (e) {
      $("listenNote").textContent = "오류: " + e.message;
    } finally {
      $("listenBtn").disabled = false;
    }
  };
  // ---------- 녹음 공통 (따라 말하기·음성 입력이 같이 씀) ----------
  // 브라우저는 HTTPS(보안 연결) 페이지에서만 마이크를 허용함. S3 웹사이트 엔드포인트(HTTP)에서는 막힘
  let activeRecorder = null;

  async function toggleRecording(btn, idleLabel, noteEl, onBlob) {
    if (activeRecorder && activeRecorder.state === "recording") { activeRecorder.stop(); return; }
    const iconOnly = btn.classList.contains("icon");
    if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
      noteEl.textContent = "마이크는 HTTPS 주소에서만 쓸 수 있어요. https:// 로 시작하는 주소로 접속해 주세요.";
      return;
    }
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      noteEl.textContent = "마이크 권한이 필요해요. 주소창의 자물쇠 아이콘에서 마이크를 허용해 주세요.";
      return;
    }
    // 브라우저마다 녹음 형식이 달라서 Transcribe가 지원하는 형식 중 가능한 것을 고름 (크롬: webm, 사파리: mp4)
    const mime = ["audio/webm", "audio/ogg", "audio/mp4"].find(m => MediaRecorder.isTypeSupported(m)) || "";
    const chunks = [];
    const rec = activeRecorder = new MediaRecorder(stream, mime ? { mimeType: mime } : {});
    const timer = setTimeout(() => rec.state === "recording" && rec.stop(), 15000);  // 15초 제한 (비용·크기 상한)
    rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      clearTimeout(timer);
      stream.getTracks().forEach(t => t.stop());
      btn.classList.remove("recording");
      if (!iconOnly) btn.textContent = idleLabel;
      if (chunks.length) onBlob(new Blob(chunks, { type: rec.mimeType }));
    };
    rec.start();
    btn.classList.add("recording");
    if (!iconOnly) btn.textContent = "⏹ 녹음 끝내기";  // 아이콘 버튼은 빨간색으로만 녹음 중임을 표시
    noteEl.textContent = "녹음 중... 다 말했으면 다시 눌러 주세요 (최대 15초).";
  }

  function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(String(r.result).split(",")[1]);  // "data:audio/webm;base64,...."에서 본문만
      r.onerror = reject;
      r.readAsDataURL(blob);
    });
  }

  // Transcribe는 비동기 작업이라 3초마다 결과 확인 (API Gateway 30초 제한을 피하는 폴링)
  async function pollJob(path, jobId, isStale) {
    for (let i = 0; i < 30; i++) {
      await new Promise(r => setTimeout(r, 3000));
      if (isStale()) return null;
      const res = await request("GET", `${path}/${jobId}`);
      if (res.status === "IN_PROGRESS") continue;
      if (res.status === "FAILED") throw new Error(res.error);
      return res;
    }
    throw new Error("인식이 너무 오래 걸려요. 다시 시도해 주세요.");
  }

  // ---------- 음성 입력 (내 언어로 말하기 → Transcribe → 입력칸) ----------
  $("sttBtn").onclick = () => toggleRecording($("sttBtn"), "🎤 말로 입력", $("sttNote"), async (blob) => {
    const lang = sourceSel.value;
    $("sttBtn").disabled = true;
    $("sttNote").textContent = "음성 인식 중... (Amazon Transcribe, 보통 10~30초)";
    try {
      const { jobId } = await post("/transcribe", { audio: await blobToBase64(blob), mime: blob.type, lang });
      const res = await pollJob("/transcribe", jobId, () => sourceSel.value !== lang);
      if (!res) return;
      if (!res.text) throw new Error("인식된 말이 없어요. 조금 더 크게 말해 주세요.");
      $("textInput").value = res.text;
      updateCount();
      $("sttNote").textContent = "인식 결과예요. 틀린 부분은 고친 뒤 [번역하기]를 눌러 주세요.";
    } catch (e) {
      $("sttNote").textContent = "오류: " + e.message;
    } finally {
      $("sttBtn").disabled = false;
    }
  });

  // ---------- 따라 말하기 (녹음 → Transcribe 현지어 인식 → 일치율) ----------
  function resetPractice(show) {
    if (activeRecorder && activeRecorder.state === "recording") activeRecorder.stop();
    $("practice").hidden = !show;
    $("practiceResult").hidden = true;
    $("practiceEmpty").hidden = false;
    $("practiceNote").textContent = "";
    $("recBtn").disabled = false;
  }

  $("recBtn").onclick = () => {
    const target = lastTranslation;
    $("practiceResult").hidden = true;
    toggleRecording($("recBtn"), "🎤 녹음 시작", $("practiceNote"), (blob) => {
      if (target === lastTranslation) submitPractice(blob, target);  // 그사이 다른 문장을 번역했으면 버림
    });
  };

  async function submitPractice(blob, target) {
    $("recBtn").disabled = true;
    $("practiceNote").textContent = "음성 인식 중... (Amazon Transcribe, 보통 10~30초)";
    try {
      const audio = await blobToBase64(blob);
      const { jobId } = await post("/practice", { audio, mime: blob.type, text: target.text, lang: target.lang });
      const res = await pollJob("/practice", jobId, () => target !== lastTranslation);
      if (!res) return;
      showPracticeResult(res);
      $("practiceNote").textContent = "음성 인식기(원어민 기준)가 알아들은 정도예요. 억양·강세 점수는 아니에요.";
    } catch (e) {
      if (target === lastTranslation) $("practiceNote").textContent = "오류: " + e.message;
    } finally {
      $("recBtn").disabled = false;
    }
  }

  function showPracticeResult(res) {
    $("scoreText").textContent = `일치율 ${res.score}%`;
    const box = $("wordsBox");
    box.textContent = "";
    res.words.forEach(w => {
      const span = document.createElement("span");
      span.className = w.ok ? "ok" : "ng";
      span.textContent = w.w;  // textContent 사용: 인식 결과를 HTML로 해석하지 않음 (XSS 방지)
      box.appendChild(span);
    });
    $("heardText").textContent = "인식된 문장: " + (res.heard || "(인식된 말이 없어요)");
    $("practiceResult").hidden = false;
    $("practiceEmpty").hidden = true;
  }
</script>
</body>
</html>
